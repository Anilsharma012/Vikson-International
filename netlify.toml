[build]
command = "npm run build:client"
functions = "netlify/functions"
publish = "dist/spa"

[functions]
external_node_modules = ["express"]
node_bundler = "esbuild"

# ---- API redirect (jo pehle tha, wahi rahe) ----
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

# ---- Serve sitemap/robots as-is (no SPA rewrite) ----
[[redirects]]
from = "/sitemap.xml"
to = "/sitemap.xml"
status = 200

[[redirects]]
from = "/robots.txt"
to = "/robots.txt"
status = 200

# ---- SPA fallback for the rest ----
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# (optional) Correct content-types
[[headers]]
for = "/sitemap.xml"
  [headers.values]
  Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/robots.txt"
  [headers.values]
  Content-Type = "text/plain; charset=utf-8"
